    <style>

<body class="p-3 sm:p-6 md:p-8 text-slate-800">

    <div class="max-w-7xl mx-auto space-y-5">
        <!-- HEADER CÔNG CỤ -->
        <div class="bg-indigo-950 text-white p-5 sm:p-6 rounded-3xl shadow-xl border border-indigo-900/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="space-y-1">
                <div class="flex items-center space-x-2.5">
                    <img src="logo-teacher.png" alt="SigmaMath" class="w-8 h-8 rounded-xl object-cover border border-amber-400/40">
                    <h1 class="text-base sm:text-xl font-black tracking-tight">BỘ BÓC TÁCH ĐỀ THI 3 PHẦN & DÁN ẢNH</h1>
                </div>
                <p class="text-xs text-indigo-300">Chuẩn hóa cấu trúc GDPT Mới: [P1] 4 lựa chọn, [P2] Đúng/Sai, [P3] Điền khuyết</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="insertSampleData()" class="bg-indigo-800 hover:bg-indigo-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition flex items-center space-x-1.5 border border-indigo-700 shadow-sm">
                    <i data-lucide="file-plus" class="w-4 h-4 text-amber-300"></i>

                <a href="index.html" class="bg-white/10 hover:bg-white/20 text-xs font-bold px-3 py-2.5 rounded-xl transition flex items-center space-x-1 border border-white/15">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Về Quản Trị</span>
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 sm:gap-6 items-start">
            <!-- CỘT NHẬP LIỆU BÊN TRÁI -->
            <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">

                        <i data-lucide="edit-3" class="w-4 h-4 text-indigo-600"></i>
                        <span>Dán Đề Thi Từ Word Vào Đây</span>
                    </h2>
                    <span class="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded-lg border border-emerald-100 flex items-center space-x-1">
                        <i data-lucide="image" class="w-3.5 h-3.5"></i>
                        <span>Ctrl + V Dán Ảnh Trực Tiếp</span>
                    </span>
                </div>

                <div id="smartEditor" contenteditable="true" 
                     placeholder="Dán nội dung từ file Word vào đây... Thầy có thể bấm Windows + Shift + S chụp hình vẽ rồi bấm Ctrl + V vào đúng vị trí câu hỏi."
                     class="editor-box w-full p-4 border-2 border-dashed border-slate-300 rounded-2xl overflow-y-auto text-xs sm:text-sm focus:border-indigo-600 bg-slate-50/50 leading-relaxed font-mono outline-none transition">
                </div>

                <div class="flex gap-2.5">
                    <button onclick="parseExamContent()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 text-xs sm:text-sm transition flex items-center justify-center space-x-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-300"></i>
                        <span>Bóc Tách Tự Động & Sửa Lỗi Toán</span>
                    </button>
                    <button onclick="clearEditor()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-4 rounded-xl text-xs sm:text-sm transition flex items-center justify-center space-x-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span>Xóa</span>
                    </button>
                </div>
            </div>

            <!-- CỘT XEM TRƯỚC BÊN PHẢI -->
            <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4 flex flex-col h-[650px] sm:h-[720px]">
                <div class="flex justify-between items-center border-b pb-3 shrink-0">
                    <h2 class="font-bold text-sm text-slate-800 flex items-center space-x-1.5">
                        <i data-lucide="eye" class="w-4 h-4 text-indigo-600"></i>
                        <span>Bản Xem Trước Của Thí Sinh</span>
                    </h2>
                    <span id="questionCounter" class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-xl">0 câu hỏi</span>
                </div>

                <div id="previewContainer" class="flex-1 overflow-y-auto space-y-3.5 pr-1">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs italic space-y-2">
                        <i data-lucide="inbox" class="w-8 h-8 stroke-1 text-slate-300"></i>
                        <span>Chưa có dữ liệu. Dán đề và bấm "Bóc Tách Tự Động" để xem kết quả.</span>
                    </div>
                </div>

                <div class="pt-3 border-t shrink-0 flex flex-wrap justify-between items-center gap-2">
                    <div class="flex items-center space-x-2">
                        <button onclick="copyJSONToClipboard()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl shadow transition flex items-center space-x-1.5">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>Sao Chép JSON</span>
                        </button>
                        <button onclick="downloadJSONFile()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl shadow transition flex items-center space-x-1.5">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                            <span>Tải Tệp .json</span>
                        </button>
                    </div>
                    <span id="exportStatus" class="text-xs text-emerald-600 font-bold font-mono"></span>
                </div>
            </div>

    <script>
        let parsedQuestions = [];
        const editor = document.getElementById('smartEditor');

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        // ==================== 1. BẮT SỰ KIỆN DÁN ẢNH TỪ CLIPBOARD ====================
        editor.addEventListener('paste', function (e) {
            const items = (e.clipboardData || window.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        document.execCommand('insertHTML', false, `<br><img src="${event.target.result}" alt="Ảnh câu hỏi" /><br>`);
                    };
                    reader.readAsDataURL(blob);
                    break;
                }
            }
        });

        // ==================== 2. CHUẨN HOÁ CÔNG THỨC TOÁN MATHTYPE / LATEX ====================
        function normalizeMathLatex(text) {
            if (!text) return '';
            return text
                // Đổi [...] sang $$...$$ (Display Math)
                .replace(/\\\[([\s\S]*?)\\\]/g, '$$$$1$$')
                // Đổi \(...\) sang $...$ (Inline Math)
                .replace(/\\\(([\s\S]*?)\\\)/g, '$1$$')                 // Chuẩn hóa dấu $$ kép
                .replace(/\$\$/g, '$');
        }

        // ==================== 3. THUẬT TOÁN BÓC TÁCH ĐỀ THI 3 PHẦN ====================
        function parseExamContent() {
            let content = editor.innerHTML;
            if (!content.trim()) { 
                alert("Khung soạn thảo đang trống! Thầy vui lòng dán nội dung đề vào trước."); 
                return; 
            }

            // Giữ lại hình ảnh, chuyển các thẻ ngắt dòng của HTML thành ký tự xuống dòng thuần túy
            content = content.replace(/<div><br><\/div>/gi, '\n')
                             .replace(/<div>/gi, '\n')
                             .replace(/<\/div>/gi, '')
                             .replace(/<p>/gi, '\n')
                             .replace(/<\/p>/gi, '')
                             .replace(/<br\s*[\/]?>/gi, '\n');

            // Chuẩn hoá công thức Toán
            content = normalizeMathLatex(content);

            // Sửa lỗi cú pháp Regex: sử dụng dấu | chuẩn xác thay vì \vert{}
            content = content.replace(/(\[(?:P1\vert{}P2\vert{}P3\vert{}PHẦN\s*[123IV]+)\]|PHẦN\s+[123IV]+[\s:.-])/gi, '\n$1\n');

            // Tách độc lập câu hỏi
            content = content.replace(/(Câu\s+\d+[\s:.-])/gi, '\n$1');

            const lines = content.split('\n').map(l => l.trim()).filter(l => l);

            parsedQuestions = [];
            let currentPart = 1; // Mặc định bắt đầu từ Phần I
            let currentQ = null;

            lines.forEach(line => {
                // Nhận diện chuyển phần thi
                const partMatch  = line.match(/(?:\[(?:P1\vert{}PHẦN\s*1\vert{}PHẦN\s*I)\]|^PHẦN\s*(?:1|I)[\s:.-])/i);
                const part2Match = line.match(/(?:\[(?:P2\vert{}PHẦN\s*2\vert{}PHẦN\s*II)\]|^PHẦN\s*(?:2|II)[\s:.-])/i);
                const part3Match = line.match(/(?:\[(?:P3\vert{}PHẦN\s*3\vert{}PHẦN\s*III)\]|^PHẦN\s*(?:3|III)[\s:.-])/i);

                if (partMatch)  { currentPart = 1; return; }
                if (part2Match) { currentPart = 2; return; }
                if (part3Match) { currentPart = 3; return; }

                // Phát hiện bắt đầu một câu hỏi mới
                const qHeaderMatch = line.match(/^Câu\s+(\d+)[\s:.-]+([\s\S]*)$/i);
                if (qHeaderMatch) {
                    if (currentQ) finalizeQuestion(currentQ);
                    currentQ = {
                        rawIndex: qHeaderMatch[1],
                        part: currentPart,
                        prompt: qHeaderMatch[2] || '',
                        lines: []
                    };
                    return;
                }

                // Dồn các dòng tiếp theo vào nội dung câu hiện tại
                if (currentQ) {
                    currentQ.lines.push(line);
                }
            });

            // Đóng câu hỏi cuối cùng
            if (currentQ) finalizeQuestion(currentQ);

            renderPreview();
        }

        // ==================== 4. PHÂN TÍCH CHI TIẾT TỪNG DẠNG CÂU HỎI ====================
        function finalizeQuestion(q) {
            const fullBody = q.lines.join(' ');
            const fullText = (q.prompt + ' ' + fullBody).trim();

            const hasABCD = /(?:\*?[A-D]\s*[\.:\)])/g.test(fullText);
            const hasSmallABCD = /(?:\*?[a-d]\s*[\.:\)])/g.test(fullText);
            const hasAnswerKeyword = /(?:Đáp án|ĐA|KQ)[\s:.-]+/i.test(fullText);

            // Tự động nhận diện lại phần nếu người ra đề quên đặt thẻ [P1], [P2], [P3]
            if (q.part === 1 && !hasABCD && hasSmallABCD) q.part = 2;
            if (q.part === 1 && !hasABCD && hasAnswerKeyword) q.part = 3;

            if (q.part === 1) {
                // PHẦN I: Trắc nghiệm 4 lựa chọn (A, B, C, D)
                let prompt = q.prompt;
                const options = [];
                let correct = '';

                const splitFirstOpt = fullText.split(/(?=\*?[A-D]\s*[\.:\)])/);
                prompt = splitFirstOpt[0].replace(/^Câu\s+\d+[\s:.-]*/i, '').trim();

                const optRegex = /(\*?)([A-D])\s*[\.:\)]\s*([\s\S]*?)(?=(?:\*?[A-D]\s*[\.:\)])|$)/g;
                let m;
                const optString = fullText.substring(prompt.length);
                while ((m = optRegex.exec(optString)) !== null) {
                    const isCorrect = m[1] === '*';
                    const letter = m[2].toUpperCase();
                    const content = m[3].trim();
                    options.push({ letter, content });
                    if (isCorrect) correct = letter;
                }

                parsedQuestions.push({
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    part: 1,
                    prompt: prompt || 'Nội dung câu hỏi',
                    options: options,
                    correct: correct
                });

            } else if (q.part === 2) {
                // PHẦN II: Đúng / Sai (4 ý a, b, c, d)
                const splitFirstOpt = fullText.split(/(?=\*?[a-d]\s*[\.:\)])/);
                const prompt = splitFirstOpt[0].replace(/^Câu\s+\d+[\s:.-]*/i, '').trim();

                const statements = [];
                const stRegex = /(\*?)([a-d])\s*[\.:\)]\s*([\s\S]*?)(?=(?:\*?[a-d]\s*[\.:\)])|$)/gi;
                let m;
                const stString = fullText.substring(prompt.length);
                while ((m = stRegex.exec(stString)) !== null) {
                    const isCorrect = m[1] === '*';
                    statements.push({
                        letter: m[2].toLowerCase(),
                        content: m[3].trim(),
                        correct: isCorrect ? 'Đ' : 'S'
                    });
                }

                parsedQuestions.push({
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    part: 2,
                    prompt: prompt,
                    statements: statements
                });

            } else if (q.part === 3) {
                // PHẦN III: Trả lời ngắn / Điền số
                let correct = '';
                const ansMatch = fullText.match(/(?:Đáp án|ĐA|KQ)[\s:.-]+([^\n]+)/i);
                if (ansMatch) {
                    correct = ansMatch[1].trim();
                }
                const prompt = fullText.replace(/(?:Đáp án|ĐA|KQ)[\s:.-]+[^\n]+/gi, '').replace(/^Câu\s+\d+[\s:.-]*/i, '').trim();

                parsedQuestions.push({
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    part: 3,
                    prompt: prompt,
                    correct: correct
                });
            }
        }

        // ==================== 5. RENDER BẢN XEM TRƯỚC ====================
        function renderPreview() {
            const container = document.getElementById('previewContainer');
            document.getElementById('questionCounter').innerText = `${parsedQuestions.length} câu hỏi`;

            if (parsedQuestions.length === 0) {
                container.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 text-xs rounded-2xl text-center font-bold">Không nhận diện được câu hỏi nào. Hãy kiểm tra định dạng "Câu 1:", "Câu 2:"...</div>`;
                return;
            }

            let html = '';
            parsedQuestions.forEach((q, idx) => {
                html += `<div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5 shadow-xs">`;
                
                // Header câu hỏi
                html += `<div class="flex justify-between items-center text-xs">
                            <span class="font-black text-indigo-900">CÂU ${idx + 1} (${q.part === 1 ? 'Trắc Nghiệm 4 Lựa Chọn' : (q.part === 2 ? 'Đúng / Sai' : 'Trả Lời Ngắn')})</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${q.part === 1 ? 'bg-blue-100 text-blue-800' : (q.part === 2 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800')}">Phần ${q.part}</span>
                         </div>`;
                
                // Nội dung câu hỏi
                html += `<div class="text-xs sm:text-sm font-medium text-slate-800 leading-relaxed">${q.prompt}</div>`;

                // Render theo từng phần
                if (q.part === 1) {
                    html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">`;
                    q.options.forEach(opt => {
                        const isRight = opt.letter === q.correct;
                        html += `<div class="p-2.5 rounded-xl border flex items-center space-x-2 text-xs ${isRight ? 'bg-emerald-50 border-emerald-300 font-bold text-emerald-800 shadow-xs' : 'bg-white border-slate-200'}">
                                    <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs shrink-0 ${isRight ? 'bg-emerald-600 text-white' : 'bg-slate-100 font-bold'}">${opt.letter}</span>
                                    <span class="flex-1">${opt.content}</span>
                                    ${isRight ? '<span class="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded uppercase font-black">Đáp án</span>' : ''}
                                 </div>`;
                    });
                    html += `</div>`;
                } 
                else if (q.part === 2) {
                    html += `<div class="space-y-1.5 pt-1">`;
                    q.statements.forEach(st => {
                        html += `<div class="p-2.5 rounded-xl bg-white border border-slate-200 flex justify-between items-center text-xs">
                                    <div class="flex items-center space-x-2"><b class="text-indigo-700">${st.letter})</b> <span>${st.content}</span></div>
                                    <span class="font-bold px-2 py-0.5 rounded text-[10px] ${st.correct === 'Đ' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${st.correct === 'Đ' ? 'ĐÚNG' : 'SAI'}</span>
                                 </div>`;
                    });
                    html += `</div>`;
                } 
                else if (q.part === 3) {
                    html += `<div class="p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-xs flex justify-between items-center">
                                <span class="text-slate-600 font-bold">Đáp án cần điền:</span>
                                <span class="font-black text-indigo-700 font-mono text-sm">${q.correct || 'Chưa nhận diện'}</span>
                             </div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;

            // Render công thức Toán KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        // ==================== 6. DỮ LIỆU MẪU ĐỂ THỬ NGHIỆM ====================
        function insertSampleData() {
            editor.innerHTML = `[P1]
Câu 1: Cho hàm số $y = f(x)$ có bảng biến thiên trên $[-1; 3]$. Tìm giá trị lớn nhất của hàm số trên $[-1; 3]$.
*A. $\\max f(x) = 5$   B. $\\max f(x) = 2$   C. $\\max f(x) = -1$   D. $\\max f(x) = 0$

Câu 2: Nghiệm của phương trình $\\log_2(x - 1) = 3$ là:
A. $x = 8$   B. $x = 7$   *C. $x = 9$   D. $x = 10$

[P2]
Câu 3: Cho tứ diện đều $ABCD$ có cạnh bằng $a$. Xét tính đúng sai của các khẳng định sau:
*a) Thể tích khối tứ diện đều bằng $\\frac{a^3\\sqrt{2}}{12}$.
b) Góc giữa hai đường thẳng $AB$ và $CD$ bằng $60^\\circ$.
*c) Diện tích toàn phần của tứ diện bằng $a^2\\sqrt{3}$.
d) Bán kính mặt cầu ngoại tiếp bằng $\\frac{a\\sqrt{6}}{2}$.

[P3]
Câu 4: Một tổ có 6 nam và 4 nữ. Chọn ngẫu nhiên 3 học sinh. Tính xác suất để có ít nhất 1 học sinh nữ.
Đáp án: 0.8

Câu 5: Trong không gian $Oxyz$, cho mặt cầu $(S): (x-1)^2 + (y+2)^2 + (z-3)^2 = 16$. Bán kính của mặt cầu $(S)$ bằng:
Đáp án: 4`;
            parseExamContent();
        }

        function clearEditor() {
            editor.innerHTML = '';
            parsedQuestions = [];
            document.getElementById('previewContainer').innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs italic space-y-2">
                    <i data-lucide="inbox" class="w-8 h-8 stroke-1 text-slate-300"></i>
                    <span>Chưa có dữ liệu.</span>
                </div>
            `;
            document.getElementById('questionCounter').innerText = '0 câu hỏi';
            document.getElementById('exportStatus').innerText = '';
            if (window.lucide) lucide.createIcons();
        }

        // ==================== 7. XUẤT VÀ SAO CHÉP DỮ LIỆU JSON ====================
        function copyJSONToClipboard() {
            if (parsedQuestions.length === 0) { 
                alert("Chưa có dữ liệu bóc tách để sao chép!"); 
                return; 
            }
            const jsonText = JSON.stringify(parsedQuestions, null, 2);
            navigator.clipboard.writeText(jsonText).then(() => {
                const st = document.getElementById('exportStatus');
                st.innerText = `✓ Đã sao chép ${parsedQuestions.length} câu vào bộ nhớ tạm!`;
                setTimeout(() => st.innerText = '', 3000);
            }).catch(() => {
                alert("Không thể sao chép tự động, vui lòng thử lại!");
            });
        }

        function downloadJSONFile() {
            if (parsedQuestions.length === 0) { 
                alert("Chưa có dữ liệu để tải về!"); 
                return; 
            }
            const blob = new Blob([JSON.stringify(parsedQuestions, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DeThi_BocTach_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
