<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cổng Thông Tin Học Sinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- ================= MÀN HÌNH ĐĂNG NHẬP ================= -->
    <div id="studentLoginScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 w-full max-w-sm text-center space-y-5">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800">CỔNG HỌC SINH</h1>
                <p class="text-xs text-slate-500 mt-0.5">Tra cứu điểm danh, học phí & khảo thí</p>
            </div>
            <form onsubmit="handleStudentLogin(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="VD: nguyenthiutman.10n1" required class="w-full p-3 border rounded-xl text-xs font-bold font-mono outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." required class="w-full p-3 border rounded-xl text-xs font-bold outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition text-xs">Đăng Nhập</button>
            </form>
            <p id="loginError" class="text-rose-600 text-xs font-bold hidden"></p>
        </div>
    </div>

    <!-- ================= DASHBOARD CÁ NHÂN HỌC SINH ================= -->
    <div id="studentDashboardScreen" class="hidden flex-1 flex flex-col">
        <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 bg-indigo-700 text-amber-400 font-black rounded-xl flex items-center justify-center text-sm" id="userAvatar">HS</div>
                    <div>
                        <h2 class="font-bold text-xs sm:text-sm leading-tight" id="headerStudentName">---</h2>
                        <p class="text-[10px] text-indigo-200" id="headerStudentClass">---</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openChangePasswordModal()" class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs px-2.5 py-1.5 rounded-xl font-bold transition flex items-center space-x-1" title="Đổi mật khẩu">
                        <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Đổi MK</span>
                    </button>
                    <button onclick="studentLogout()" class="bg-indigo-950 hover:bg-rose-600 text-white text-xs px-2.5 py-1.5 rounded-xl font-bold transition flex items-center space-x-1">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
            <!-- BANNER VÀO THI ONLINE -->
            <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 rounded-3xl p-5 text-white shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="space-y-1 text-center sm:text-left">
                    <span class="bg-amber-400 text-indigo-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">Khảo thí trực tuyến</span>
                    <h3 class="text-base sm:text-lg font-black">Phòng Thi Trắc Nghiệm Online</h3>
                    <p class="text-xs text-indigo-100">Bấm để vào làm bài kiểm tra đang mở của lớp.</p>
                </div>
                <button onclick="goToExamApp()" class="w-full sm:w-auto bg-amber-400 hover:bg-amber-300 text-indigo-950 font-black text-xs px-5 py-3 rounded-2xl shadow transition flex items-center justify-center space-x-1.5 shrink-0">
                    <span>Vào Phòng Thi</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- TABS ĐIỀU HƯỚNG -->
            <nav class="flex items-center space-x-2 border-b pb-2">
                <button onclick="switchStudentTab('tuition')" id="stab-btn-tuition" class="stab-btn px-4 py-2 rounded-xl font-bold text-xs text-indigo-600 bg-indigo-50">Học Phí</button>
                <button onclick="switchStudentTab('attendance')" id="stab-btn-attendance" class="stab-btn px-4 py-2 rounded-xl font-bold text-xs text-slate-500 hover:bg-slate-100">Điểm Danh</button>
                <button onclick="switchStudentTab('exams')" id="stab-btn-exams" class="stab-btn px-4 py-2 rounded-xl font-bold text-xs text-slate-500 hover:bg-slate-100">Lịch Sử Thi</button>
                <button onclick="switchStudentTab('documents')" id="stab-btn-documents" class="stab-btn px-4 py-2 rounded-xl font-bold text-xs text-slate-500 hover:bg-slate-100">Tài Liệu</button>
            </nav>

            <!-- TAB 1: HỌC PHÍ MINH BẠCH (THEO KỲ CỦA LỚP) -->
            <section id="stab-tuition" class="stab-content space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-bold text-sm text-slate-800 border-b pb-2">Trạng Thái Học Phí Các Kỳ</h3>
                    <div id="studentTuitionCards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
                </div>
            </section>

            <!-- TAB 2: ĐIỂM DANH -->
            <section id="stab-attendance" class="stab-content hidden space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-bold text-sm text-slate-800 border-b pb-2">Nhật Ký Điểm Danh Cá Nhân</h3>
                    <div id="studentAttendanceList" class="space-y-2"></div>
                </div>
            </section>

            <!-- TAB 3: LỊCH SỬ THI -->
            <section id="stab-exams" class="stab-content hidden space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-bold text-sm text-slate-800 border-b pb-2">Kết Quả Các Bài Thi Đã Nộp</h3>
                    <div id="studentExamResultsList" class="space-y-2"></div>
                </div>
            </section>

            <!-- TAB 4: TÀI LIỆU -->
            <section id="stab-documents" class="stab-content hidden space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-bold text-sm text-slate-800 border-b pb-2">Tài Liệu Của Lớp</h3>
                    <div id="studentDocsList" class="space-y-2"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL ĐỔI MẬT KHẨU -->
    <div id="modalChangePassword" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl border w-full max-w-sm space-y-4">
            <div class="flex justify-between border-b pb-2"><h3 class="font-bold text-sm">Đổi Mật Khẩu Cá Nhân</h3><button onclick="closeChangePasswordModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
            <form onsubmit="handleSaveNewPassword(event)" class="space-y-3 text-xs">
                <div><label class="block font-bold mb-1">Mật khẩu mới</label><input type="password" id="newPasswordInput" required minlength="4" class="w-full p-2.5 border rounded-xl outline-none font-bold"></div>
                <div><label class="block font-bold mb-1">Xác nhận mật khẩu mới</label><input type="password" id="confirmNewPasswordInput" required minlength="4" class="w-full p-2.5 border rounded-xl outline-none font-bold"></div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl shadow">Lưu Mật Khẩu</button>
            </form>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbznfqhckK2L97z427a50oLuZ0W0nLbtdDcJROOv6S2sGQL3_OGbK0Fs7Hd8wOi_or5cXA/exec";
        const SESSION_KEY = 'ACTIVE_STUDENT_SESSION';

        let appData = { classes: [], students: [], attendance: [], payments: [], documents: [], exams: [], examResults: [] };
        let currentStudent = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            loadStudentCloudData();
        });

        async function loadStudentCloudData() {
            try {
                const res = await fetch(CLOUD_API_URL);
                const j = await res.json();
                if(j.Classes) appData.classes = j.Classes.slice(1).map(r=>({id:String(r[0]||''), name:String(r[1]||''), fee:parseFloat(r[2])||0}));
                if(j.Students) appData.students = j.Students.slice(1).map(r=>({id:String(r[0]||''), classId:String(r[1]||''), code:String(r[2]||''), name:String(r[3]||''), phone:String(r[4]||''), joinDate:String(r[5]||''), customFee:r[6]!==''&&r[6]!==null?parseFloat(r[6]):null, username:String(r[7]||''), password:String(r[8]||'')}));
                if(j.Attendance) appData.attendance = j.Attendance.slice(1).map(r=>({studentId:String(r[0]||''), date:String(r[1]||''), status:String(r[2]||''), note:String(r[3]||'')}));
                if(j.Payments) appData.payments = j.Payments.slice(1).map(r=>({id:String(r[0]||''), studentId:String(r[1]||''), classId:String(r[2]||''), cycleIndex:parseInt(r[3]), amount:parseFloat(r[4])||0, status:String(r[5]||''), method:String(r[6]||''), date:String(r[8]||'')}));
                if(j.Documents) appData.documents = j.Documents.slice(1).map(r=>({id:String(r[0]||''), classId:String(r[1]||''), name:String(r[2]||''), url:String(r[4]||'')}));
                if(j.Exams) appData.exams = j.Exams.slice(1).map(r=>({id:String(r[0]||''), title:String(r[1]||''), classId:String(r[2]||''), duration:parseInt(r[3])||45, matrix:JSON.parse(r[6]||'{}')}));
                if(j.ExamResults) appData.examResults = j.ExamResults.slice(1).map(r=>({id:String(r[0]||''), examId:String(r[1]||''), studentId:String(r[2]||''), score:parseFloat(r[3]||0), submittedAt:String(r[6]||'')}));

                checkSavedSession();
            } catch(e) { console.error("Lỗi:", e); }
        }

        // TỰ ĐỘNG GIỮ ĐĂNG NHẬP NHƯ APP
        function checkSavedSession() {
            const savedId = localStorage.getItem(SESSION_KEY);
            if(savedId) {
                const s = appData.students.find(x => x.id === savedId);
                if(s) {
                    currentStudent = s;
                    showDashboard();
                }
            }
        }

        function handleStudentLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim().toLowerCase();
            const p = document.getElementById('loginPassword').value.trim();
            const err = document.getElementById('loginError');

            const s = appData.students.find(x => (x.username.toLowerCase() === u || x.code.toLowerCase() === u) && x.password === p);
            if(!s) {
                err.innerText = "Tên đăng nhập hoặc mật khẩu không chính xác!";
                err.classList.remove('hidden');
                return;
            }

            currentStudent = s;
            localStorage.setItem(SESSION_KEY, s.id); // Lưu phiên đăng nhập
            err.classList.add('hidden');
            showDashboard();
        }

        function studentLogout() {
            localStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        function showDashboard() {
            document.getElementById('studentLoginScreen').classList.add('hidden');
            document.getElementById('studentDashboardScreen').classList.remove('hidden');

            const c = appData.classes.find(x => x.id === currentStudent.classId);
            document.getElementById('headerStudentName').innerText = currentStudent.name;
            document.getElementById('headerStudentClass').innerText = `Lớp: ${c ? c.name : '---'} • Mã HS: ${currentStudent.code}`;
            document.getElementById('userAvatar').innerText = currentStudent.name.split(' ').pop().charAt(0).toUpperCase();

            renderStudentTuition();
            renderStudentAttendance();
            renderStudentExams();
            renderStudentDocs();
            if (window.lucide) lucide.createIcons();
        }

        function switchStudentTab(id) {
            document.querySelectorAll('.stab-content').forEach(e => e.classList.add('hidden'));
            document.querySelectorAll('.stab-btn').forEach(b => {
                b.classList.remove('bg-indigo-50', 'text-indigo-600');
                b.classList.add('text-slate-500');
            });
            document.getElementById(`stab-${id}`).classList.remove('hidden');
            const act = document.getElementById(`stab-btn-${id}`);
            act.classList.add('bg-indigo-50', 'text-indigo-600');
            act.classList.remove('text-slate-500');
        }

        // RENDER HỌC PHÍ PHƯƠNG ÁN B MINH BẠCH
        function renderStudentTuition() {
            const container = document.getElementById('studentTuitionCards');
            const c = appData.classes.find(x => x.id === currentStudent.classId);
            const stdFee = currentStudent.customFee !== null ? currentStudent.customFee : (c ? c.fee : 0);

            const classSessions = [...new Set(appData.attendance.filter(a => appData.students.some(cs=>cs.classId===currentStudent.classId && cs.id===a.studentId)).map(a=>a.date))].sort();
            const totalClassSess = classSessions.length;
            const activeCycleIdx = Math.max(0, Math.floor((totalClassSess - 1) / 8));
            const skipCount = classSessions.filter(d => d < currentStudent.joinDate).length;
            const joinCycle = Math.floor(skipCount / 8);

            let html = '';
            for(let i=0; i<4; i++) {
                const p = appData.payments.find(x => x.studentId === currentStudent.id && x.cycleIndex === i);
                let stC = 'bg-slate-50 border-slate-200 text-slate-400', txt = 'Chưa đến', amount = stdFee;

                if(i === joinCycle && skipCount > 0) {
                    const actualSess = 8 - (skipCount % 8);
                    amount = Math.round((stdFee / 8) * actualSess);
                }

                if(p && p.status === 'PAID') {
                    stC = 'bg-emerald-50 border-emerald-200 text-emerald-800';
                    txt = `ĐÃ NỘP: ${p.amount.toLocaleString()}đ<br><span class="text-[10px] text-slate-500 font-normal">${p.date}</span>`;
                } else if(i < joinCycle) {
                    txt = 'Chưa vào học';
                } else if(i < activeCycleIdx) {
                    stC = 'bg-rose-50 border-rose-200 text-rose-700 font-bold';
                    txt = `NỢ: ${amount.toLocaleString()}đ`;
                } else if(i === activeCycleIdx) {
                    stC = 'bg-amber-50 border-amber-200 text-amber-800 font-bold';
                    txt = `CẦN NỘP: ${amount.toLocaleString()}đ`;
                }

                html += `
                    <div class="p-4 rounded-2xl border ${stC} space-y-1">
                        <div class="text-[11px] font-bold uppercase">Kỳ ${i + 1}</div>
                        <div class="text-xs leading-relaxed">${txt}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // RENDER ĐIỂM DANH
        function renderStudentAttendance() {
            const list = appData.attendance.filter(a => a.studentId === currentStudent.id).sort((a,b)=>b.date.localeCompare(a.date));
            const c = document.getElementById('studentAttendanceList');
            if(list.length === 0) { c.innerHTML = '<div class="text-xs text-slate-400 italic">Chưa có dữ liệu điểm danh.</div>'; return; }

            c.innerHTML = list.map(a => {
                let badge = '<span class="text-emerald-600 font-bold">🟢 Có mặt</span>';
                if(a.status === 'ABSENT_PERM') badge = '<span class="text-amber-500 font-bold">🟡 Vắng có phép</span>';
                else if(a.status === 'ABSENT_NO_PERM') badge = '<span class="text-rose-600 font-bold">🔴 Vắng không phép</span>';
                else if(a.status === 'LATE') badge = '<span class="text-blue-500 font-bold">🔵 Đi trễ</span>';

                return `
                    <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                        <span class="font-mono font-bold">${a.date}</span>
                        <div>${badge}</div>
                    </div>
                `;
            }).join('');
        }

        // RENDER LỊCH SỬ THI
        function renderStudentExams() {
            const list = appData.examResults.filter(r => r.studentId === currentStudent.id).reverse();
            const c = document.getElementById('studentExamResultsList');
            if(list.length === 0) { c.innerHTML = '<div class="text-xs text-slate-400 italic">Bạn chưa nộp bài thi nào.</div>'; return; }

            c.innerHTML = list.map(r => {
                const ex = appData.exams.find(e => e.id === r.examId) || {title: 'Đề thi'};
                return `
                    <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                        <div><b>${ex.title}</b><div class="text-[10px] text-slate-400">${new Date(r.submittedAt).toLocaleString('vi-VN')}</div></div>
                        <div class="text-base font-black text-indigo-700">${r.score.toFixed(1)}đ</div>
                    </div>
                `;
            }).join('');
        }

        // RENDER TÀI LIỆU
        function renderStudentDocs() {
            const list = appData.documents.filter(d => d.classId === currentStudent.classId);
            const c = document.getElementById('studentDocsList');
            if(list.length === 0) { c.innerHTML = '<div class="text-xs text-slate-400 italic">Chưa có tài liệu nào.</div>'; return; }

            c.innerHTML = list.map((d, i) => `
                <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                    <span>${i + 1}. <b>${d.name}</b></span>
                    <a href="${d.url}" target="_blank" class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg font-bold">Xem / Tải</a>
                </div>
            `).join('');
        }

        // ĐỔI MẬT KHẨU
        function openChangePasswordModal() { document.getElementById('modalChangePassword').classList.remove('hidden'); }
        function closeChangePasswordModal() { document.getElementById('modalChangePassword').classList.add('hidden'); }

        async function handleSaveNewPassword(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPasswordInput').value;
            const p2 = document.getElementById('confirmNewPasswordInput').value;
            if(p1 !== p2) { alert("Hai mật khẩu mới không khớp nhau!"); return; }

            try {
                await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'changePassword', studentId: currentStudent.id, newPassword: p1 })
                });
                currentStudent.password = p1;
                alert("Đổi mật khẩu thành công!");
                closeChangePasswordModal();
            } catch(err) { alert("Lỗi khi đổi mật khẩu!"); }
        }

        function goToExamApp() { window.location.href = 'exam.html'; }
    </script>
</body>
</html>
